<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>English PlayLab | Learn English Through Play</title><style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
:root{--ink:#233158;--purple:#6953d9;--pink:#ff7199;--blue:#48b5ef;--green:#32bd9b;--yellow:#ffc94e;--cream:#fffaf3}*{box-sizing:border-box}body{margin:0;font-family:Nunito,Arial,sans-serif;background:#f7f8ff;color:var(--ink)}button{font:inherit;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}.app{min-height:100vh}.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px max(22px,calc((100vw - 1120px)/2));background:#fff;box-shadow:0 4px 20px #303b6810;gap:15px;flex-wrap:wrap}.logo{font-weight:900;font-size:23px;color:var(--purple)}.logo span{color:var(--pink)}.nav{display:flex;gap:10px;align-items:center}.chip{background:#f0edff;color:#6253bd;padding:9px 14px;border-radius:30px;font-size:13px;font-weight:900}.btn{border:0;background:var(--purple);color:#fff;border-radius:15px;padding:13px 22px;font-weight:900;box-shadow:0 6px 0 #4b37aa;transition:.12s}.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #4b37aa}.btn.alt{background:#fff;color:var(--purple);border:2px solid #e5e1ff;box-shadow:none}.btn.green{background:var(--green);box-shadow:0 6px 0 #21997c}.btn.small{padding:8px 13px;font-size:13px;box-shadow:none}.container{max-width:1120px;margin:auto;padding:35px 24px 70px}.hero{background:linear-gradient(120deg,#6854d8,#9986ed);border-radius:28px;min-height:245px;padding:38px 42px;color:white;display:flex;justify-content:space-between;align-items:center;gap:20px;overflow:hidden;position:relative}.hero:after{content:'✦ ✧ ★ ✦';position:absolute;right:20px;top:20px;opacity:.22;font-size:80px}.hero h1{font-size:clamp(28px,4vw,47px);line-height:1.12;margin:8px 0}.hero p{max-width:480px;font-weight:700;opacity:.9}.mascot{font-size:125px;filter:drop-shadow(0 12px 2px #4731a94d);z-index:1}.eyebrow{font-weight:900;letter-spacing:1.5px;font-size:12px;text-transform:uppercase}.section-title{font-size:25px;font-weight:900;margin:33px 0 15px}.subtitle{color:#7782a2;margin-top:-9px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.day{background:white;border:2px solid #eaeaf6;border-radius:22px;padding:19px 13px;text-align:center;min-height:210px;display:flex;flex-direction:column;align-items:center;gap:9px;position:relative}.day.open{border-color:#afa5f7}.day.done{border-color:#82d9be}.day .emoji{font-size:49px}.day h3{margin:0;font-size:17px}.day p{font-size:12px;color:#7b85a0;margin:0;flex:1}.day .state{font-size:11px;font-weight:900;color:#6a57ca}.day.locked{background:#f2f3fa;opacity:.75}.units{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.unit{background:white;border-radius:19px;padding:20px;display:flex;gap:14px;align-items:center;border:1px solid #ebedf8}.unit .symbol{font-size:36px}.unit strong{display:block}.unit small{color:#8a93aa}.unit.locked{opacity:.52}.panel{background:#fff;border-radius:25px;padding:27px;box-shadow:0 8px 30px #3641770d}.back{border:0;background:none;color:var(--purple);font-weight:900;margin-bottom:16px}.game-layout{display:grid;grid-template-columns:1fr 290px;gap:18px}.lesson-card{background:linear-gradient(135deg,#f1edff,#fff2f7);border-radius:22px;padding:30px;text-align:center}.lesson-card .illustration{font-size:72px}.lesson-card h2{font-size:34px;margin:8px}.lesson-card p{font-size:17px}.lesson-card .meaning{color:#6c58b4;font-weight:900}.progress{height:11px;border-radius:15px;background:#eae8f9;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#8d78f1,#ff8aab);transition:.3s}.pill{background:#e9f8f3;color:#239f7e;padding:7px 13px;border-radius:30px;font-size:12px;font-weight:900;display:inline-block}.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.choice{background:#fff;border:2px solid #e3e6f4;border-radius:17px;padding:15px;font-weight:900;color:var(--ink);min-height:58px}.choice:hover{border-color:#a99bee;background:#f8f6ff}.choice.correct{background:#e5fbf3;border-color:#35c9a2}.choice.wrong{background:#ffedf0;border-color:#ff7698}.notice{padding:13px;border-radius:12px;background:#f0edff;color:#6253b6;font-weight:800;margin:12px 0}.side{background:#fff;border-radius:24px;padding:23px;align-self:start}.side h3{margin-top:0}.side li{margin:10px 0;color:#6d7692;font-size:13px}.game-board{background:#f8f8ff;border-radius:21px;padding:24px;min-height:250px}.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.memory-card{min-height:85px;background:#7262dd;border:0;border-radius:14px;color:white;font-size:26px;font-weight:900}.memory-card.revealed{background:white;color:var(--ink);border:2px solid #d9d5f9}.memory-card.matched{background:#d9faee;color:#1b9675}.word-pool,.sentence-line{display:flex;gap:10px;flex-wrap:wrap;min-height:70px;align-items:center;justify-content:center;padding:10px;border:2px dashed #dcd8fa;border-radius:15px;margin:13px 0}.word{border:0;border-radius:12px;padding:12px 18px;background:#e8e2ff;color:#5340a8;font-weight:900}.sentence-line .word{background:#d9f7ee;color:#1e9676}.characters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.character{padding:18px 8px;border-radius:18px;background:white;border:2px solid #e3e6f4;text-align:center;font-weight:900}.character .face{font-size:47px}.character:hover{border-color:var(--purple)}.map{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.location{border:2px solid #e7e5fa;border-radius:20px;background:white;padding:20px;text-align:center;font-weight:900}.location .face{font-size:52px}.location.done{background:#e5fbf3;border-color:#4fc6a8}.reward{text-align:center;padding:35px}.reward .trophy{font-size:100px}.reward h2{font-size:34px}.footer{text-align:center;color:#99a1b7;font-size:12px;margin:35px 0}.hidden{display:none!important}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.units{grid-template-columns:1fr}.game-layout{grid-template-columns:1fr}.hero{padding:25px}.mascot{font-size:68px}.memory-grid{grid-template-columns:repeat(3,1fr)}.characters{grid-template-columns:1fr}.topbar{padding:13px 20px}.container{padding:22px 15px}.day{min-height:190px}}
.stage-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}.stage-heading .pill{font-size:12px}.memory-card{min-height:84px}.game-board .choice{min-height:55px} .game-board{min-height:300px}@media(max-width:600px){.stage-heading{gap:6px}.memory-card{min-height:76px}}
</style><style>
.arcade-scene{position:relative;min-height:290px;border-radius:24px;overflow:hidden;padding:22px;text-align:center;margin:15px 0;box-shadow:inset 0 -7px 0 #0000000b}.pet-scene{background:linear-gradient(#bfeeff 0 60%,#a7e8a0 60%)}.arcade-sky{font-size:30px;letter-spacing:28px}.pet-character{font-size:100px;filter:drop-shadow(0 12px 4px #0002);animation:bouncePet 1.8s infinite}.pet-bubble{background:white;padding:10px 16px;border-radius:20px;max-width:360px;margin:auto;box-shadow:0 4px 12px #0001}.pet-bars{max-width:260px;margin:12px auto;display:flex;gap:9px;align-items:center;font-size:12px;font-weight:900}.meter{background:#fff;border-radius:30px;flex:1;height:13px;overflow:hidden}.meter i{display:block;background:#ff79a3;height:100%;border-radius:30px}.pet-items{display:flex;justify-content:space-around;font-size:26px}.arcade-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}.arcade-tile{border:3px solid #d9d1ff;background:white;color:#302e61;border-radius:18px;padding:15px;font-size:19px;font-weight:900;box-shadow:0 5px 0 #d9d1ff;transition:transform .12s}.arcade-tile:active,.fall-star:active,.island-spot:active{transform:scale(.94)}.arcade-tile small{display:block;font-size:13px}.star-scene{background:linear-gradient(160deg,#302363,#6953d9);color:white}.star-cloud{font-size:33px}.star-mission{background:#ffffff20;border-radius:18px;padding:13px;margin:12px auto;max-width:300px}.falling-stars{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin:18px auto;max-width:470px}.fall-star{border:0;background:#ffdc67;color:#503c12;border-radius:20px;padding:10px;font-size:30px;font-weight:900;animation:floatStar 2s infinite alternate;box-shadow:0 7px 0 #d2a82d}.fall-star span{display:block;font-size:14px}.arcade-ground{font-size:30px}.island-scene{background:linear-gradient(#c7efff 0 50%,#5cccbf 50%)}.island-header{background:#fff9;padding:12px;border-radius:18px}.island-path{display:flex;justify-content:space-around;align-items:center;gap:8px;margin:20px 0}.island-spot{background:#fff8;border:3px solid #fff;border-radius:50% 50% 20% 20%;width:32%;min-height:116px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;gap:8px;font-size:12px;color:#334}.island-tree{font-size:50px}.island-hero{font-size:34px}.story-scene{background:linear-gradient(145deg,#ffd7ec,#d7e8ff)}.story-cast{font-size:100px;animation:bouncePet 2s infinite}.story-cast span{font-size:55px}.story-speech{background:#fff;border-radius:24px;padding:20px;max-width:350px;margin:0 auto 12px;font-size:19px;font-weight:900}.story-caption{font-size:13px}@keyframes bouncePet{50%{transform:translateY(-10px)}}@keyframes floatStar{to{transform:translateY(-11px)}}@media(max-width:540px){.arcade-scene{min-height:250px;padding:13px}.pet-character,.story-cast{font-size:75px}.island-tree{font-size:36px}.arcade-options{grid-template-columns:1fr}.island-spot{font-size:10px}}
</style></head><body><div class="app"><header class="topbar"><div class="logo">🎮 ENGLISH <span>PLAYLAB</span></div><div class="nav"><span class="chip" id="starCount">⭐ 0 Stars</span><button class="btn alt small" onclick="showHome()">🏠 Home</button></div></header><main class="container" id="screen"></main><footer class="footer">ENGLISH PLAYLAB · Prototipo educativo interactivo · Unit 1: Hello, World!</footer></div>
<script>
const DAYS=[{name:'Monday',title:'Memory Flip',icon:'🃏',topic:'Greetings',desc:'Aprende saludos y encuentra las parejas.'},{name:'Tuesday',title:'Sentence Builder',icon:'🧩',topic:'My name is…',desc:'Ordena palabras y crea tus primeras frases.'},{name:'Wednesday',title:"Who's Talking?",icon:'🎧',topic:"What's your name?",desc:'Escucha pistas y descubre quién habla.'},{name:'Thursday',title:'Talk to Friends',icon:'🗺️',topic:'How are you?',desc:'Explora la escuela y conversa con amigos.'},{name:'Friday',title:'Friendship Quest',icon:'🏆',topic:'Weekly Adventure',desc:'¡Usa todo lo aprendido esta semana!'}];
const LESSONS=[[{emoji:'👋',en:'Hello!',es:'¡Hola!',tip:'We say HELLO when we meet someone.'},{emoji:'☀️',en:'Good morning!',es:'¡Buenos días!',tip:'We say GOOD MORNING at the beginning of the day.'},{emoji:'👋',en:'Goodbye!',es:'¡Adiós!',tip:'We say GOODBYE when we leave.'}],[{emoji:'🙋',en:'My name is Leo.',es:'Me llamo Leo.',tip:'Use MY NAME IS to tell someone your name.'},{emoji:'😊',en:'I am Mia.',es:'Soy Mia.',tip:'You can also say I AM and then your name.'}],[{emoji:'❓',en:"What's your name?",es:'¿Cómo te llamas?',tip:'Ask WHAT’S YOUR NAME? to learn a new friend’s name.'},{emoji:'💬',en:'My name is Sam.',es:'Me llamo Sam.',tip:'Answer using MY NAME IS and your name.'}],[{emoji:'🙂',en:'How are you?',es:'¿Cómo estás?',tip:'Ask HOW ARE YOU? when you greet a friend.'},{emoji:'😄',en:"I'm fine, thank you!",es:'¡Estoy bien, gracias!',tip:'This is one friendly way to answer.'}],[{emoji:'🌟',en:'You are ready!',es:'¡Ya estás listo!',tip:'Use greetings, names and friendly questions to meet new friends.'}]];
let progress=JSON.parse(localStorage.getItem('gq_progress')||'{}');let stars=Number(localStorage.getItem('gq_stars')||0);let currentDay=0,lessonIndex=0,phase='lesson',gameState={};
function persist(){localStorage.setItem('gq_progress',JSON.stringify(progress));localStorage.setItem('gq_stars',stars);document.getElementById('starCount').textContent='⭐ '+stars+' Stars'}
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}}
function screen(html){document.getElementById('screen').innerHTML=html;persist()}
function showHome(){const completed=Object.values(progress).filter(Boolean).length;screen(`<div class="hero"><div><div class="eyebrow">✨ Learn · Play · Explore</div><h1>Your English<br>Adventure Starts Here!</h1><p>Aprende inglés paso a paso con una mini lección y un juego diferente cada día. ¡El viernes te espera una gran misión!</p><button class="btn green" onclick="startDay(${Math.min(completed,4)})">🚀 Continue Adventure</button></div><div class="mascot">🦊</div></div><h2 class="section-title">🗓️ Week 1 · Hello, World!</h2><p class="subtitle">Cada día tiene una explicación interactiva y un juego diferente. Puedes volver a practicar cuando quieras.</p><div class="grid">${DAYS.map((d,i)=>`<div class="day ${progress[i]?'done':'open'}"><div class="emoji">${d.icon}</div><div class="eyebrow">${d.name}</div><h3>${d.title}</h3><p>${d.desc}</p><span class="state">${progress[i]?'✓ Completed':i===4?'⭐ Final challenge':'▶ Ready to play'}</span><button class="btn small ${progress[i]?'alt':''}" onclick="startDay(${i})">${progress[i]?'Replay':'Play'}</button></div>`).join('')}</div><h2 class="section-title">🗺️ Your Learning Path</h2><div class="units">${[['🌈','1. Hello, World!','Greetings and introductions'],['🎨','2. My Colorful World','Colors, numbers and objects'],['👨‍👩‍👧','3. My Family','Family and the verb to be'],['🦁','4. Animal Kingdom','Animals and simple descriptions'],['⏰','5. My Daily Routine','Daily activities and present simple'],['🌍','6. Let’s Explore!','Places and simple questions']].map((u,i)=>`<div class="unit ${i?'locked':''}"><div class="symbol">${u[0]}</div><div><strong>${u[1]} ${i?'🔒':'🟢'}</strong><small>${u[2]}</small></div></div>`).join('')}</div><p class="subtitle" style="margin-top:18px">*Este prototipo incluye cinco juegos funcionales de la primera unidad. Las siguientes unidades muestran la ruta educativa planeada.</p>`)}
function startDay(i){currentDay=i;lessonIndex=0;phase='lesson';renderLesson()}
function wrapper(title,body,side=''){screen(`<button class="back" onclick="showHome()">← Back to Learning Path</button><div class="game-layout"><section class="panel"><span class="pill">${DAYS[currentDay].name} · ${DAYS[currentDay].topic}</span><h1>${title}</h1>${body}</section><aside class="side"><h3>🦊 Your Quest Guide</h3><p style="color:#7b85a0;font-size:14px">${side||'Aprende a tu ritmo. Escucha las palabras, practica y diviértete.'}</p><hr style="border:0;border-top:1px solid #eee"><h3>🌟 Your Progress</h3><div class="progress"><div style="width:${Object.values(progress).filter(Boolean).length*20}%"></div></div><p style="font-size:13px;color:#8a92a8">${Object.values(progress).filter(Boolean).length} of 5 days completed</p></aside></div>`)}
function renderLesson(){const list=LESSONS[currentDay],l=list[lessonIndex];wrapper('✨ Mini Lesson',`<p class="subtitle">Primero aprendemos algo nuevo. Después comienza el juego.</p><div class="progress"><div style="width:${(lessonIndex+1)/list.length*100}%"></div></div><div class="lesson-card" style="margin-top:18px"><div class="illustration">${l.emoji}</div><h2>${l.en}</h2><div class="meaning">${l.es}</div><p>${l.tip}</p><button class="btn alt" onclick="speak(${JSON.stringify(l.en)})">🔊 Listen in English</button></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px"><span class="subtitle" style="margin:0">Card ${lessonIndex+1} of ${list.length}</span><button class="btn" onclick="nextLesson()">${lessonIndex===list.length-1?'🎮 Start Game':'Next →'}</button></div>`,'¡No necesitas saber inglés antes de comenzar! Cada día introduce contenido nuevo, paso a paso.')}
function nextLesson(){if(lessonIndex<LESSONS[currentDay].length-1){lessonIndex++;renderLesson()}else{phase='game';initGame()}}
function complete(message){if(!progress[currentDay])stars+=currentDay===4?100:25;progress[currentDay]=true;persist();wrapper('🎉 Mission Complete!',`<div class="reward"><div class="trophy">${currentDay===4?'🏆':'🌟'}</div><h2>Awesome Job!</h2><p>${message}</p><div class="notice">+${currentDay===4?'100':'25'} stars · ${DAYS[currentDay].name} completed</div><button class="btn green" onclick="showHome()">🗺️ Back to My Map</button> <button class="btn alt" onclick="startDay(${currentDay})">↻ Play Again</button></div>`)}
function initGame(){if(currentDay===0){gameState={cards:shuffle([{v:'👋',id:1},{v:'Hello!',id:1},{v:'☀️',id:2},{v:'Good morning!',id:2},{v:'🚪',id:3},{v:'Goodbye!',id:3}]),open:[],matched:[],moves:0};renderMemory()}if(currentDay===1){gameState={index:0,placed:[],sentences:[['My','name','is','Leo.'],['I','am','Mia.'],['My','name','is','Sam.']]};renderBuilder()}if(currentDay===2){gameState={index:0,correct:0};renderMystery()}if(currentDay===3){gameState={visited:[],selected:null};renderExplore()}if(currentDay===4){gameState={stage:0,score:0,chosen:null};renderFinal()}}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function renderMemory(){const s=gameState;wrapper('🃏 Memory Flip',`<p>Find the matching pairs! Encuentra las parejas entre imágenes y saludos.</p><div class="game-board"><div class="memory-grid">${s.cards.map((c,i)=>`<button class="memory-card ${s.matched.includes(i)?'matched':s.open.includes(i)?'revealed':''}" onclick="flip(${i})">${s.matched.includes(i)||s.open.includes(i)?c.v:'?'}</button>`).join('')}</div></div><div class="notice">Pairs: ${s.matched.length/2}/3 · Moves: ${s.moves}</div>`,'Destapa dos cartas. Recuerda dónde están los saludos y sus dibujos.')}
function flip(i){const s=gameState;if(s.open.length>=2||s.open.includes(i)||s.matched.includes(i))return;s.open.push(i);renderMemory();if(s.open.length===2){s.moves++;const[a,b]=s.open;if(s.cards[a].id===s.cards[b].id){s.matched.push(a,b);s.open=[];if(s.matched.length===6){setTimeout(()=>complete('You matched all the greetings!'),450)}else renderMemory()}else setTimeout(()=>{s.open=[];renderMemory()},850)}}
function renderBuilder(){const s=gameState;if(s.index===s.sentences.length){complete('You built all your English sentences!');return}const words=s.sentences[s.index];wrapper('🧩 Sentence Builder',`<p>Tap the words in the correct order. ¡Construye la oración!</p><div class="game-board"><h3>Sentence ${s.index+1} / ${s.sentences.length}</h3><div class="sentence-line">${s.placed.map((w,i)=>`<button class="word" onclick="removeWord(${i})">${w} ×</button>`).join('')||'<span style="color:#a7a4c5">Tap words below to build your sentence…</span>'}</div><div class="word-pool">${shuffle(words.filter((w,i)=>{let count=words.slice(0,i+1).filter(x=>x===w).length;return s.placed.filter(x=>x===w).length<count})).map(w=>`<button class="word" onclick="addWord(${JSON.stringify(w)})">${w}</button>`).join('')}</div><div id="builderFeedback"></div><button class="btn" onclick="checkSentence()">✓ Check Sentence</button></div>`,'Usa las palabras que acabas de aprender. Tócalas para ordenarlas y formar una frase.')}
function addWord(w){gameState.placed.push(w);renderBuilder()}function removeWord(i){gameState.placed.splice(i,1);renderBuilder()}function checkSentence(){const s=gameState;if(s.placed.join(' ')===s.sentences[s.index].join(' ')){s.index++;s.placed=[];renderBuilder()}else document.getElementById('builderFeedback').innerHTML='<div class="notice">Try again! Revisa el orden de las palabras. 💜</div>'}
const MYSTERY=[{audio:'Hello! My name is Mia.',q:'Who said: My name is Mia?',options:[['👧','Mia'],['👦','Leo'],['🧑','Sam']],correct:0},{audio:'Good morning! My name is Leo.',q:'Who said: My name is Leo?',options:[['🧑','Sam'],['👧','Mia'],['👦','Leo']],correct:2},{audio:'Hi! My name is Sam.',q:'Who said: My name is Sam?',options:[['👦','Leo'],['🧑','Sam'],['👧','Mia']],correct:1}];
function renderMystery(){const s=gameState;if(s.index>=MYSTERY.length){complete('You solved the listening mystery!');return}const q=MYSTERY[s.index];wrapper("🎧 Who's Talking?",`<p>Listen to the clue and find the correct character.</p><div class="game-board" style="text-align:center"><div style="font-size:68px">🔊</div><button class="btn" onclick="speak(${JSON.stringify(q.audio)})">▶ Play Audio Clue</button><h3>${q.q}</h3><div class="characters">${q.options.map((o,i)=>`<button class="character" onclick="answerMystery(${i})"><div class="face">${o[0]}</div>${o[1]}</button>`).join('')}</div></div><div class="notice">Clue ${s.index+1} of 3 · ${s.correct} correct</div>`,'Escucha la voz del personaje. Puedes repetir el audio tantas veces como quieras.')}
function answerMystery(i){const s=gameState;if(i===MYSTERY[s.index].correct){s.correct++;s.index++;renderMystery()}else{const n=document.querySelector('.notice');n.textContent='Not quite! Listen again and try another character. 💜'}}
const EXPLORE=[{emoji:'👧',name:'Mia',prompt:'Hello! How are you?',choices:['I’m fine, thank you!','My name is red.'],correct:0},{emoji:'👦',name:'Leo',prompt:'Hi! What’s your name?',choices:['Goodbye!','My name is Alex.'],correct:1},{emoji:'🧑',name:'Sam',prompt:'Good morning!',choices:['Good morning!','I am a table.'],correct:0},{emoji:'👩‍🏫',name:'Teacher',prompt:'How are you?',choices:['I’m fine, thank you!','Goodbye name.'],correct:0}];

function starGame(){const w=dailyWord();options=shuffle([w,...CURRICULUM[currentDay].words.filter(x=>x!==w).slice(0,3)]);return `<div class="arcade-scene star-scene"><div class="star-cloud">✨ 🌙 ✨</div><div class="star-mission">🎯 Atrapa: <b>${w[2]}</b></div><div class="falling-stars">${options.map((o,i)=>`<button class="fall-star" style="animation-delay:${i*.17}s" onclick="starAnswer(${i})">⭐<span>${o[1]}</span></button>`).join('')}</div><div class="arcade-ground">🏔️ 🌲 🏕️ 🌲 🏔️</div></div><p class="subtitle" style="text-align:center">¡Toca la estrella con la expresión correcta!</p>`}
function starAnswer(i){arcadeNext(options[i]===dailyWord())}
function islandGame(){const w=dailyWord();options=shuffle([w,...CURRICULUM[currentDay].words.filter(x=>x!==w).slice(0,2)]);return `<div class="arcade-scene island-scene"><div class="island-header">🧭 Misión ${round+1}: encuentra <b>${w[2]}</b></div><div class="island-path">${options.map((o,i)=>`<button class="island-spot" onclick="islandAnswer(${i})"><span class="island-tree">${['🏠','🌴','🏰'][i]}</span><span>${o[1]}</span></button>`).join('')}</div><div class="island-hero">🧑‍🚀 🐕</div></div><p class="subtitle" style="text-align:center">Visita el lugar que contiene la palabra correcta.</p>`}
function islandAnswer(i){arcadeNext(options[i]===dailyWord())}
function storyGame(){const q=CURRICULUM[currentDay].dialogues[round%5];options=shuffle([q[1],q[2]]);return `<div class="arcade-scene story-scene"><div class="story-cast">${['👧','👦','🧑‍🚀','👩‍🏫','🧙'][round]} <span>🐶</span></div><div class="story-speech">💬 ${q[0]}</div><div class="story-caption">¡Elige qué decir para continuar la historia!</div></div><div class="arcade-options">${options.map((o,i)=>`<button class="arcade-tile" onclick="storyAnswer(${i})">💬 ${o}</button>`).join('')}</div><button class="btn alt small" onclick='speak(${JSON.stringify(q[0])})'>🔊 Escuchar diálogo</button>`}
function storyAnswer(i){arcadeNext(options[i]===CURRICULUM[currentDay].dialogues[round%5][1])}

showHome();
</script></body></html>
